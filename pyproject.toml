[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telecom-churn-revenue"
version = "1.0.0"
description = "Telecom customer churn prediction and 12-month revenue at risk, with a FastAPI scoring service and Power BI views."
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["churn"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
