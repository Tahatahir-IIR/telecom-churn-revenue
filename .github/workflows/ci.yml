name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHONPATH: src:.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Train
        run: python -m churn.train
      - name: Load SQLite and views
        run: python -m churn.db
      - name: Test
        run: pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            reports/metrics.json
            reports/feature_importance.csv
            reports/figures/*.png

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt && python -m churn.train
      - run: docker build -t telecom-churn-api .
